<button
  type="button"
  class="menu-toggle"
  [attr.aria-expanded]="menuOpen"
  aria-label="Obre el menu"
  (click)="toggleMenu($event)">
  <span></span>
  <span></span>
  <span></span>
</button>

<nav
  class="app-menu"
  [class.app-menu-open]="menuOpen"
  aria-label="Navegacio principal"
  (click)="closeMenu()">
  <div class="menu-row menu-row-primary">
  <button
    type="button"
    class="menu-button menu-partidas"
    [class.menu-button-active]="activePage === 'partidas'"
    routerLink="/app/partidas">
    Partides
  </button>

  <button
    type="button"
    class="menu-button menu-rankings"
    [class.menu-button-active]="activePage === 'rankings'"
    routerLink="/app/rankings">
    Rankings
  </button>
  <button
    type="button"
    class="menu-button menu-pendent-compra"
    [class.menu-button-active]="activePage === 'pendentCompra'"
    routerLink="/app/pendent-compra">
    Pendent comprar
  </button>
  <button
    type="button"
    class="menu-button menu-remar"
    [class.menu-button-active]="activePage === 'remar'"
    routerLink="/app/remar">
    Remar
  </button>

  <button
    type="button"
    class="menu-button menu-juegos"
    [class.menu-button-active]="activePage === 'juegos'"
    routerLink="/app/juegos">
    Ludoteca
  </button>

  <button
    type="button"
    class="menu-button menu-randomizer"
    [class.menu-button-active]="activePage === 'aleatoritzador'"
    routerLink="/app/aleatoritzador"
    aria-label="Aleatoritzador"
    title="Aleatoritzador">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3c4 0 5 12 9 12h6"></path><path d="m18 15 3 3-3 3"></path><path d="M3 18h3c1.7 0 2.8-2.2 3.8-4.7"></path><path d="M14.2 8.7C15.2 7.1 16.2 6 18 6h3"></path><path d="m18 3 3 3-3 3"></path></svg>
  </button>
  </div>

  <div class="menu-row menu-row-secondary">
  <button
    *ngIf="canUseAssistencia()"
    type="button"
    class="menu-button menu-assistencia"
    [class.menu-button-active]="activePage === 'assistencia'"
    routerLink="/app/assistencia">
    Assistència
  </button>

  <button
    type="button"
    class="menu-button menu-enquestes"
    [class.menu-button-active]="activePage === 'enquestes'"
    routerLink="/app/enquestes">
    Enquestes
    <span class="menu-badge" *ngIf="pendingSurveys > 0">{{ pendingSurveys }}</span>
  </button>

  <button
    *ngIf="primaryLabel"
    type="button"
    class="menu-button menu-button-primary menu-primary-action"
    (click)="onPrimaryAction()">
    {{ primaryLabel }}
  </button>

  <button
    type="button"
    class="menu-button menu-usuario"
    [class.menu-button-active]="activePage === 'usuario'"
    routerLink="/app/usuario">
    Usuari
  </button>

  <div class="session-actions">
    <button
      type="button"
      class="menu-button refresh-icon-button"
      aria-label="Refrescar"
      title="Refrescar"
      (click)="refresh()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 6v5h-5"></path>
        <path d="M19 11a7 7 0 1 0-2.05 4.95"></path>
      </svg>
    </button>

    <button type="button" class="menu-button logout-button" (click)="onLogout()">Sortir</button>
  </div>
  </div>
</nav>
